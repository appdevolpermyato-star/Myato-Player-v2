name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Decode Google Services JSON
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json

      - name: Decode Debug Keystore
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 || vars.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
        continue-on-error: true

      - name: Create Dummy Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            # If the secret isn't set, try to use the one from the repo if it exists (base64)
            if [ -f debug.keystore.base64 ]; then
              cat debug.keystore.base64 | base64 -d > debug.keystore
            fi
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Artifacts
        run: |
          mkdir -p outputs
          # Find the generated release APK and copy it to a standard location
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} outputs/MyatoPlayer-release.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyatoPlayer-Release-APK
          path: outputs/MyatoPlayer-release.apk
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: outputs/MyatoPlayer-release.apk
          name: MyatoPlayer ${{ github.ref_name }}
          body: |
            Nova versão oficial do MyatoPlayer disponível!
            
            **Instalação:**
            Baixe o arquivo `MyatoPlayer-release.apk` abaixo e instale no seu Android.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
